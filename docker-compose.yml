services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aifun
      POSTGRES_PASSWORD: aifun
      POSTGRES_DB: aifun
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aifun"]
      interval: 2s
      timeout: 3s
      retries: 10

  api:
    build: ./engine
    env_file: ./engine/.env
    environment:
      DATABASE_URL: postgresql+psycopg://aifun:aifun@postgres:5432/aifun
    ports:
      - "8000:8000"
    volumes:
      - ./engine/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./web
    environment:
      # Runs client-side in the browser, not container-to-container — must
      # be the host-exposed API URL, not the `api` service's Docker DNS name.
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
