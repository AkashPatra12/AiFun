[project]
name = "aifun"
version = "0.1.0"
description = "Auto Reel/Shorts Generator - turns long-form video into short-form social clips"
requires-python = ">=3.11"
dependencies = [
    "ffmpeg-python",
    "openai-whisper",
    "opencv-python",
    "pydantic",
    "pyyaml",
    "typer",
    "sqlalchemy",
    "psycopg[binary]",
    "python-dotenv",
]

[project.scripts]
aifun = "aifun.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
