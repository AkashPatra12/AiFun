[project]
name = "aifun"
version = "0.1.0"
description = "Auto Reel/Shorts Generator - turns long-form video into short-form social clips"
requires-python = ">=3.11"
dependencies = [
    "ffmpeg-python",
    "openai-whisper",
    "opencv-python>=4.8,<5",  # 5.x dropped CascadeClassifier + bundled Haar cascades
    "scenedetect",
    "certifi",
    "pydantic",
    "pyyaml",
    "typer",
    "sqlalchemy",
    "psycopg[binary]",
    "python-dotenv",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
]

[project.optional-dependencies]
test = [
    "pytest",
    "httpx",
]

[project.scripts]
aifun = "aifun.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
